chapitre: 18-remede-trois-niveaux
redacteur: gemini
modifications:
  - id: "001"
    motif: phrase-longue
    avant: |
      On appelle **pré-mortem** l’exercice qui consiste à supposer que le projet a échoué et à écrire pourquoi, avant de l’engager : l’équipe se place six mois ou un an après la mise en service, tient l’échec pour acquis et en rédige le récit.
    apres: |
      On appelle **pré-mortem** l’exercice qui consiste à supposer que le projet a échoué et à écrire pourquoi, avant de l’engager. L’équipe se place ainsi six mois ou un an après la mise en service, tient l’échec pour acquis et en rédige le récit.
    note: "Coupe articulée au deux-points avec « ainsi »."

  - id: "002"
    motif: phrase-longue
    avant: |
      Pour l’acte, elle rejoint la marge d’humilité du @sec:ch17 (@sec:ch17-course-revisitee) : quand la décision est unique et lourde de conséquences, la prudence prend la forme d’une marge $b$ ajoutée au risque estimé ; cette marge relève du jugement et non d’une mesure du facteur omis $z$.
    apres: |
      Pour l’acte, elle rejoint la marge d’humilité du @sec:ch17 (@sec:ch17-course-revisitee) : quand la décision est unique et lourde de conséquences, la prudence prend la forme d’une marge $b$ ajoutée au risque estimé. Cette marge relève du jugement et non d’une mesure du facteur omis $z$.
    note: "Scinde une phrase de 48 mots au point-virgule."
