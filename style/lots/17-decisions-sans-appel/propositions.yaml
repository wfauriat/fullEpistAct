chapitre: 17-decisions-sans-appel
redacteur: gemini
modifications:
  - id: "001"
    motif: or-initial
    avant: |
      Or c’est le mât réel que la mer éprouve, non la fiche technique (@sec:ch02-monde-action).
    apres: |
      Mais c’est le mât réel que la mer éprouve, non la fiche technique (@sec:ch02-monde-action).
    note: "Remplace « Or » en tête de phrase par « Mais »."

  - id: "002"
    motif: or-initial
    avant: |
      Or $z$ désigne, par définition, ce que le cadre n’a pas retenu : aucune décomposition de la variance sur l’ensemble des alternatives admises ne le fait apparaître (@prop:desaccord, @sec:ch05), et aucun contrôle interne ne peut le lire (@prop:cause-commune, @sec:ch07).
    apres: |
      Mais $z$ désigne, par définition, ce que le cadre n’a pas retenu : aucune décomposition de la variance sur l’ensemble des alternatives admises ne le fait apparaître (@prop:desaccord, @sec:ch05), et aucun contrôle interne ne peut le lire (@prop:cause-commune, @sec:ch07).
    note: "Remplace « Or » en tête de phrase par « Mais »."

  - id: "003"
    motif: phrase-longue
    avant: |
      Un taux de réussite élevé, mesuré sur des cas antérieurs ou sur des tests de référence, ne promet rien pour *cette* instance : elle peut tomber parmi les rares échecs, se situer au-delà de la frontière en dents de scie de l’outil (@sec:ch12-frontiere-dents-scie) ou dépendre d’un facteur $z$ absent des séries passées.
    apres: |
      Un taux de réussite élevé, mesuré sur des cas antérieurs ou sur des tests de référence, ne promet rien pour *cette* instance. Elle peut en effet tomber parmi les rares échecs, se situer au-delà de la frontière en dents de scie de l’outil (@sec:ch12-frontiere-dents-scie) ou dépendre d’un facteur $z$ absent des séries passées.
    note: "Scinde une phrase de 50 mots au deux-points avec « en effet »."

  - id: "004"
    motif: phrase-longue
    avant: |
      Le @sec:ch16 (@sec:ch16-etranglement-evaluation) a montré la fragilité de cette exigence : la capacité d’une institution à répondre honnêtement (conserver la provenance, entretenir des équipes capables de regarder sous l’interface, ne pas sacrifier la relecture au débit) est justement ce que la course au volume tend à vider.
    apres: |
      Le @sec:ch16 (@sec:ch16-etranglement-evaluation) a montré la fragilité de cette exigence. La capacité d’une institution à répondre honnêtement (conserver la provenance, entretenir des équipes capables de regarder sous l’interface, ne pas sacrifier la relecture au débit) est justement ce que la course au volume tend à vider.
    note: "Coupe au deux-points."
